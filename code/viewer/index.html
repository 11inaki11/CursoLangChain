<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 80 · live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
  /* Served by lab_viewer.py. Polls /state and draws the REAL agent's lab. */
  :root {
    --base: #0d0826; --bg: #0b0620; --surface: #170e3a; --line: #2e2270; --line-soft: #231a58;
    --text: #ece8ff; --muted: #a39cd6; --dim: #6f68a3;
    --pink: #ff2a6d; --cyan: #05d9e8; --yellow: #f9c80e; --purple: #b967ff; --green: #3dfc9b;
    --pixel: "Press Start 2P", ui-monospace, monospace; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; padding: 20px; }
  .frame { max-width: 1240px; margin: 0 auto; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--base); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar .title { font: .62rem var(--pixel); color: var(--muted); letter-spacing: .08em; flex: 1; }
  .led { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
  .led.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status { font: .75rem var(--mono); color: var(--muted); }
  .brain { font: .74rem var(--mono); color: var(--purple); border: 1px solid rgba(185,103,255,.4); padding: 3px 9px; border-radius: 999px; }
  .brain:empty { display: none; }
  .body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); min-height: 560px; }
  .world { padding: 16px; border-right: 1px solid var(--line-soft); background: radial-gradient(ellipse at 50% 120%, rgba(255,42,109,.18), transparent 60%); }
  svg { width: 100%; height: auto; display: block; }
  .cell { fill: none; stroke: rgba(46,34,112,.7); }
  .station { fill: rgba(23,14,58,.9); stroke-width: 1.5; }
  .label { font: 8px var(--pixel); text-anchor: middle; }
  .robot { transition: transform .9s cubic-bezier(.45, 0, .25, 1); }
  .robot .bob { animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .item { transition: transform .8s, opacity .3s; }
  .hud { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .card { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
  .card b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); transition: width .6s; }
  .console { display: flex; flex-direction: column; max-height: 640px; }
  .console-head { padding: 9px 14px; font: .55rem var(--pixel); color: var(--dim); border-bottom: 1px solid var(--line-soft); letter-spacing: .08em; }
  .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .empty { margin: auto; color: var(--dim); text-align: center; font-size: .88rem; }
  .msg { border-radius: 10px; padding: 8px 11px; background: var(--surface); border-left: 3px solid var(--c); font-size: .86rem; animation: in .35s ease-out both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .msg .kind { font: .7rem var(--mono); color: var(--c); margin-bottom: 2px; }
  .msg.human { --c: var(--cyan); } .msg.ai { --c: var(--pink); } .msg.call { --c: var(--pink); } .msg.world { --c: var(--yellow); }
  .msg.system { --c: var(--purple); } .msg.gate_ok { --c: var(--green); } .msg.gate_reject { --c: var(--pink); background: rgba(255,42,109,.08); }
  .msg.retrieval { --c: var(--green); }
  .hit { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: rgba(61,252,155,.06); border: 1px solid rgba(61,252,155,.2); font-size: .8rem; color: var(--muted); white-space: pre-wrap; }
  .hit b { color: var(--green); font: 500 .74rem var(--mono); display: block; margin-bottom: 2px; }
  .msg.note { --c: var(--dim); background: transparent; border: 1px dashed var(--line); color: var(--muted); font-style: italic; }
  .msg.call .text { font-family: var(--mono); color: var(--yellow); font-size: .82rem; }
  .text { white-space: pre-wrap; word-break: break-word; }
  @media (max-width: 860px) { .body { grid-template-columns: 1fr; } .world { border-right: 0; border-bottom: 1px solid var(--line-soft); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="frame">
  <div class="bar"><span class="led" id="led"></span><span class="title" id="title">LAB 80 · LIVE FROM YOUR PYTHON SCRIPT</span><span class="brain" id="brain"></span><span class="status" id="status">connecting…</span></div>
  <div class="body">
    <div class="world"><svg id="map" viewBox="-6 -6 460 348"></svg><div class="hud" id="hud"></div></div>
    <div class="console">
      <div class="console-head">AGENT CONSOLE · REAL MESSAGES AND TOOL CALLS</div>
      <div class="log" id="log"><div class="empty">Waiting for the agent…</div></div>
    </div>
  </div>
</div>
<script>
  const CELL = 56, NS = "http://www.w3.org/2000/svg";
  const STATIONS = { dock: ["DOCK", "#3dfc9b"], shelf_a: ["SHELF A", "#05d9e8"], workbench: ["BENCH", "#f9c80e"], door: ["DOOR", "#b967ff"], shelf_b: ["SHELF B", "#ff2a6d"] };
  const ITEMS = { red_cube: ["#ff3b3b", 12, 12], sensor_kit: ["#05d9e8", 16, 10], wrench: ["#f9c80e", 16, 5] };
  const SPRITE = [".....aa.....", "......a.....", "..hhhhhhhh..", "..hwwhhwwh..", "..hwehhweh..", "..hhhhhhhh..",
                  "..hhmmmmhh..", "....bbbb....", ".abbbbbbbba.", ".a.bbyybb.a.", "...bbbbbb...", "..tt....tt.."];
  const PALETTES = [
    { h: "#ff2a6d", b: "#b967ff", w: "#fff", e: "#0b0620", a: "#f9c80e", y: "#05d9e8", m: "#0b0620", t: "#3a2a8a" },
    { h: "#05d9e8", b: "#2b6cb0", w: "#fff", e: "#0b0620", a: "#ff2a6d", y: "#f9c80e", m: "#0b0620", t: "#3a2a8a" },
    { h: "#f9c80e", b: "#ff8a3d", w: "#fff", e: "#0b0620", a: "#05d9e8", y: "#ff2a6d", m: "#0b0620", t: "#3a2a8a" },
    { h: "#3dfc9b", b: "#1f8a70", w: "#fff", e: "#0b0620", a: "#b967ff", y: "#f9c80e", m: "#0b0620", t: "#3a2a8a" },
  ];
  const LABELS = { system: "SystemMessage", human: "HumanMessage · operator", ai: "AIMessage", call: "AIMessage · tool_call",
                   world: "ToolMessage · lab", retrieval: "ToolMessage · search_manuals", note: "// note", gate_ok: "Safety gate ✓ published to ROS 2", gate_reject: "Safety gate ✗ rejected" };
  const map = document.getElementById("map"), log = document.getElementById("log"), hud = document.getElementById("hud");
  let robotEls = {}, itemEls = {};
  let drawn = false, seen = 0, session = null;

  // A new script run = a new session: go back to the initial lab and an empty console.
  function reset(s) {
    session = s.id;
    robotEls = {}; itemEls = {}; drawn = false; seen = 0;
    map.innerHTML = ""; hud.innerHTML = "";
    log.innerHTML = `<div class="empty">Waiting for the agent…</div>`;
    document.getElementById("title").textContent = `LAB 80 · ${s.title}`.toUpperCase();
    document.getElementById("brain").textContent = s.model ? `🧠 ${s.model}` : "";
    document.title = `Lab 80 · ${s.title}`;
  }

  const sprite = (p) => SPRITE.map((row, y) => [...row].map((c, x) => c === "." ? "" :
    `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${p[c]}"/>`).join("")).join("");
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  function drawStatic(state) {
    const [W, H] = state.grid;
    let s = "";
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) s += `<rect class="cell" x="${x * CELL}" y="${y * CELL}" width="${CELL}" height="${CELL}"/>`;
    for (const [k, [x, y]] of Object.entries(state.locations)) {
      const [label, col] = STATIONS[k] || [k.toUpperCase(), "#a39cd6"];
      s += `<rect class="station" x="${x * CELL + 3}" y="${y * CELL + 3}" width="${CELL - 6}" height="${CELL - 6}" rx="8" stroke="${col}"/>
            <text class="label" x="${x * CELL + CELL / 2}" y="${y * CELL + CELL - 8}" fill="${col}">${label}</text>`;
    }
    map.innerHTML = s + `<g id="items"></g><g id="robots"></g>`;
    for (const [k, [col, w, h]] of Object.entries(ITEMS)) {
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "item");
      g.innerHTML = `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="2" fill="${col}" stroke="#0b0620" stroke-width="1.5"/>`;
      map.querySelector("#items").appendChild(g); itemEls[k] = g;
    }
    drawn = true;
  }

  function center(state, loc) { const [x, y] = state.locations[loc]; return [x * CELL + CELL / 2, y * CELL + CELL / 2]; }

  function update(state) {
    if (state.session.id !== session) reset(state.session);
    if (!drawn) drawStatic(state);
    const perLoc = {};
    for (const [k, where] of Object.entries(state.items)) {
      const g = itemEls[k]; if (!g) continue;
      if (where.startsWith("robot:")) { g.style.opacity = 0; continue; }
      perLoc[where] = (perLoc[where] || 0) + 1;
      const [cx, cy] = center(state, where);
      g.style.opacity = 1;
      g.style.transform = `translate(${cx + (perLoc[where] - 1) * 14 - 8}px, ${cy + 8}px)`;
    }
    const n = state.robots.length;
    state.robots.forEach((r, i) => {
      let g = robotEls[r.name];
      if (!g) {
        g = document.createElementNS(NS, "g");
        g.setAttribute("class", "robot");
        g.innerHTML = `<g class="bob"><svg x="-17" y="-22" width="34" height="34" viewBox="0 0 12 12" shape-rendering="crispEdges">${sprite(PALETTES[i % PALETTES.length])}</svg></g><g class="carry" transform="translate(0,-28)"></g>`;
        map.querySelector("#robots").appendChild(g); robotEls[r.name] = g;
      }
      const [cx, cy] = center(state, r.position);
      g.style.transform = `translate(${cx + (n > 1 ? (i - (n - 1) / 2) * 20 : 0)}px, ${cy - 4}px)`;
      const it = r.holding && ITEMS[r.holding];
      g.querySelector(".carry").innerHTML = it ? `<rect x="${-it[1] / 2}" y="${-it[2] / 2}" width="${it[1]}" height="${it[2]}" rx="2" fill="${it[0]}" stroke="#0b0620" stroke-width="1.5"/>` : "";
    });
    hud.innerHTML = state.robots.map((r) => `<div class="card">${esc(r.name)} · <b>${esc(r.position)}</b>
      <div>🔋 <b>${r.battery}%</b> · ✋ <b>${esc(r.holding || "—")}</b></div><div class="meter"><i style="width:${r.battery}%"></i></div></div>`).join("");
    const fresh = state.events.slice(seen);
    if (fresh.length) log.querySelector(".empty")?.remove();
    for (const e of fresh) {
      const who = e.robot && e.kind !== "world" ? ` · ${esc(e.robot)}` : e.kind === "world" && e.robot ? ` · ${esc(e.robot)}` : "";
      const hits = (e.hits || []).map((h) => `<div class="hit"><b>${esc(h.source)} · score ${Number(h.score).toFixed(2)}</b>${esc(h.text)}</div>`).join("");
      log.insertAdjacentHTML("beforeend", `<div class="msg ${e.kind}"><div class="kind">${LABELS[e.kind] || e.kind}${who}</div><div class="text">${esc(e.text)}</div>${hits}</div>`);
    }
    if (fresh.length) log.scrollTop = log.scrollHeight;
    seen = state.events.length;
  }

  async function poll() {
    try {
      const res = await fetch("/state", { cache: "no-store" });
      update(await res.json());
      document.getElementById("led").className = "led on";
      document.getElementById("status").textContent = "connected";
    } catch {
      document.getElementById("led").className = "led";
      document.getElementById("status").textContent = "script finished · run another one to reuse this tab";
    }
    setTimeout(poll, 300);
  }
  poll();
</script>
</body>
</html>
